<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SKYE HSE Copilot</title></head>
<body>
<section id="login"><h1>SKYE HSE COPILOT</h1><label>Company / Organisation</label><input id="company"><label>Email address</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="primary" onclick="signIn()">Sign in to SKYE</button><button onclick="createCompany()">Create company account</button><button onclick="resendConfirmation()">Resend confirmation email</button><p id="confirmationHelp">Use this if your confirmation email has expired or was sent to the wrong address.</p></section>
<section id="app" class="hidden"><h1>SKYE HSE COPILOT</h1><div>ACTIVE WORKSPACE: <strong id="workspaceName">Company</strong></div><button onclick="logout()">Sign out</button><h2>Good day 👋</h2><p>Your HSE workspace for risk assessment, safety management, operational guidance and controlled company knowledge.</p></section>
<style>.hidden{display:none!important}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:30px}section{max-width:600px;margin:auto}input{display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box}button{padding:12px 18px;margin:5px;border-radius:8px;border:1px solid #0b3d91}.primary{background:#0b3d91;color:white}#confirmationHelp{font-size:12px;color:#667085}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lwobrgsquuerhwmplaze.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4iLGQP-3yZ-vw4Y3hpR7JA_OOc6LIoy";
window.skyeSupabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
function createCompany(){window.location.href='register.html';}
async function resendConfirmation(){
  const email=document.getElementById('email').value.trim();
  if(!email){alert('Enter your email address first.');return;}
  const {error}=await window.skyeSupabase.auth.resend({type:'signup',email,options:{emailRedirectTo:'https://geeskye.github.io/skye-hse-copilot/index.html'}});
  if(error){console.error(error);alert(error.message||'Unable to resend confirmation email.');return;}
  alert('A fresh confirmation email has been sent. Check your inbox.');
}
</script>
<script src="auth.js?v=20260810-7"></script>
